   c.boost=Math.max(0,c.boost-dt);

   c.group.position.y=Math.sin(t*12+c.i)*.025;
   c.group.rotation.y=Math.sin(t*1.1+c.i)*.025;
  }
  const active=racing&&(c.boost>0||now<c.burst);

 }
 const gap=order[0].progress-order[1].progress;
 colorTarget.setHex(colors[leader.i]);dominationColor.lerp(colorTarget,Math.min(1,dt*1.8));
 for(const mat of dominationMaterials){mat.color.copy(dominationColor);mat.emissive.copy(dominationColor)}
 // Keep visual interpolation at frame rate, but batch all DOM writes at ~8 Hz.

 if(uiTick>=.12){

  const leaderHex='#'+dominationColor.getHexString();
  battleEl.style.borderColor=leaderHex;

  const remainingMetres=Math.max(0,Math.ceil(RACE_METRES-leader.progress*.86));

  document.getElementById('progressFill').style.width=Math.min(100,leader.progress)+'%';

  markerElements.forEach((marker,i)=>{marker.style.left=Math.max(0,Math.min(98,cars[i].progress))+'%'});
  const underdog=order[3],deficit=Math.max(0,Math.round((leader.progress-underdog.progress)*.86));

 }
 const cameraTargets=[
  {pos:[0,17,focusZ+30],aim:[0,.65,focusZ-3]},

 ];
