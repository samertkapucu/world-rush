<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WORLD RUSH Supporters</title><style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;color:white;font-family:Inter,'Segoe UI',sans-serif}#thanks{position:absolute;top:70%;left:8%;right:14%;padding:16px 20px;border:1px solid #8fdfff;border-radius:14px;background:#071724d9;box-shadow:0 0 25px #60dfff50;text-align:center;font-weight:850;font-size:28px;opacity:0;transform:translateY(14px);transition:opacity .25s,transform .25s}#thanks.on{opacity:1;transform:none}#board{position:absolute;top:8%;right:12%;max-width:35%;padding:10px;background:#071724d9;border:1px solid #8fdfff;border-radius:10px;font-size:18px}#board[hidden]{display:none}
</style><div id="thanks" aria-live="polite"></div><div id="board" hidden></div><script>
'use strict';
const params=new URLSearchParams(location.search),boardEnabled=params.get('leaderboard')==='1';
const thanks=document.querySelector('#thanks'),board=document.querySelector('#board');
const seen=new Set(),entries=[];let live=false,timer=0,socket,round=Math.floor(Date.now()/600000),previous='';
function trim(){const cutoff=Date.now()-600000;while(entries.length&&entries[0].time<cutoff)entries.shift();const next=Math.floor(Date.now()/600000);if(next!==round){const leaders=totals();previous=leaders[0]?.name||'';round=next;entries.length=0}render()}
function totals(){const counts=new Map();for(const e of entries){const item=counts.get(e.id)||{name:e.name,score:0};item.score+=e.value;counts.set(e.id,item)}return [...counts.values()].sort((a,b)=>b.score-a.score).slice(0,3)}
function render(){board.hidden=!boardEnabled||!entries.length;if(board.hidden)return;const leaders=totals();board.replaceChildren();const title=document.createElement('strong');title.textContent='SUPPORTERS · 10 MIN';board.append(title,document.createElement('br'));leaders.forEach((item,i)=>{const row=document.createElement('div');row.textContent=`${i+1}. ${item.name} · ${item.score} diamonds`;board.append(row)});if(previous){const row=document.createElement('small');row.textContent='Previous: '+previous;board.append(row)}}
function receive(msg){if(msg.type==='status'){live=!!msg.connected;return}if(msg.type!=='gift'||!live)return;const id=String(msg.eventId||'');if(!id||seen.has(id))return;seen.add(id);if(seen.size>2000)seen.delete(seen.values().next().value);const userId=String(msg.userId||'').slice(0,100),name=String(msg.nickname||userId||'Viewer').replace(/[\r\n]/g,' ').slice(0,36);thanks.textContent='THANK YOU · '+name;thanks.classList.add('on');clearTimeout(timer);timer=setTimeout(()=>thanks.classList.remove('on'),3000);const value=Number(msg.diamondValue);if(userId&&Number.isFinite(value)&&value>0)entries.push({id:userId,name,value:Math.min(value,1e8),time:Date.now()});trim()}
function connect(){const host=location.hostname;if(location.protocol!=='http:'||!['localhost','127.0.0.1'].includes(host))return;socket=new WebSocket('ws://127.0.0.1:8765');socket.onmessage=e=>{try{receive(JSON.parse(e.data))}catch{}};socket.onclose=()=>{live=false;setTimeout(connect,5000)}}connect();setInterval(trim,30000);
</script></html>
